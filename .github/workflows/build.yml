name: Build AAFSS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore
      run: dotnet restore AAFSS.sln
    
    - name: Build libraries
      run: |
        dotnet build src/AAFSS.PluginContracts/AAFSS.PluginContracts.csproj -c Release --no-restore
        dotnet build src/AAFSS.Core/AAFSS.Core.csproj -c Release --no-restore
        dotnet build src/AAFSS.Infrastructure/AAFSS.Infrastructure.csproj -c Release --no-restore
    
    - name: Build App (allow XAML warnings)
      run: dotnet build src/AAFSS.App/AAFSS.App.csproj -c Release --no-restore
      continue-on-error: true
    
    - name: Publish App
      run: dotnet publish src/AAFSS.App/AAFSS.App.csproj -c Release -o publish/ --no-restore
      continue-on-error: true
    
    - name: Upload App
      uses: actions/upload-artifact@v4
      with:
        name: AAFSS-App
        path: publish/
    
    - name: Upload Libraries
      uses: actions/upload-artifact@v4
      with:
        name: AAFSS-Libraries
        path: |
          src/AAFSS.Core/bin/Release/net8.0-windows/AAFSS.Core.dll
          src/AAFSS.Infrastructure/bin/Release/net8.0-windows/AAFSS.Infrastructure.dll
          src/AAFSS.PluginContracts/bin/Release/net8.0-windows/AAFSS.PluginContracts.dll
