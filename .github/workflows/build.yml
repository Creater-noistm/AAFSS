name: Build AAFSS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Show SDK info
      run: dotnet --info
    
    - name: Restore
      run: dotnet restore AAFSS.sln
    
    - name: Build
      run: dotnet build AAFSS.sln -c Release --no-restore
    
    - name: Publish App
      run: dotnet publish src/AAFSS.App/AAFSS.App.csproj -c Release --no-build -o publish/
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AAFSS-App
        path: publish/
